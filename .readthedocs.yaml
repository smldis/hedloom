version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      - python tools/stage_docs.py

python:
  install:
    - requirements: docs/requirements.txt
    - path: flow
    - path: exec
    - path: run
    - path: .

sphinx:
  configuration: build/docs-source/conf.py
  fail_on_warning: true
