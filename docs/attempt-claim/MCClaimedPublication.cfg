\* The proposed repair: the claim is held until the terminal record is
\* written, so publication has one writer. Expected: all invariants hold and
\* the state space is deadlock-free. This is the baseline the four mutations
\* below are taken from, one denied assumption each.
SPECIFICATION Spec
CONSTANTS
    Callers = {c1, c2}
    Outcomes = {succeeded, unreconciled}
    MaxCrashes = 1
    LockHonoured = TRUE
    DiscoveryIsAccurate = TRUE
    OwnerBoundLifetime = TRUE
    PublishUnderClaim = TRUE
    PublishOrder = "manifest-first"
    RefusesWhenBlind = TRUE
INVARIANT TypeOK
INVARIANT AtMostOneLive
INVARIANT LiveJobHasDurableTrace
INVARIANT TerminalHasEvidence
INVARIANT RecordMatchesEvidence
CHECK_DEADLOCK TRUE
