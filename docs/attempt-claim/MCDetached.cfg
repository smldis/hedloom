\* Mutation: work outlives the caller that submitted it -- a pooled or
\* detached substrate rather than `bsub -I` -- *and* discovery cannot see it.
\* This is the pair the `attached` disposition exists for. Expected:
\* AtMostOneLive is violated: the crash window resubmits work that is still
\* running, and nothing on the farm says otherwise.
SPECIFICATION Spec
CONSTANTS
    Callers = {c1, c2}
    Outcomes = {succeeded, unreconciled}
    MaxCrashes = 1
    LockHonoured = TRUE
    DiscoveryIsAccurate = FALSE
    OwnerBoundLifetime = FALSE
    PublishUnderClaim = TRUE
    PublishOrder = "manifest-first"
INVARIANT TypeOK
INVARIANT AtMostOneLive
INVARIANT LiveJobHasDurableTrace
INVARIANT TerminalHasEvidence
INVARIANT RecordMatchesEvidence
CHECK_DEADLOCK TRUE
