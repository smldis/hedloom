\* Mutation: flock does not exclude. This is a study root on an NFS mount
\* with local_lock=flock/all or -o nolock, where the lock is granted to both
\* hosts and neither is told. Expected: the durable record loses the trace of
\* a running job, and then two `bsub -I` jobs run for one identity.
SPECIFICATION Spec
CONSTANTS
    Callers = {c1, c2}
    Outcomes = {succeeded, unreconciled}
    MaxCrashes = 1
    LockHonoured = FALSE
    DiscoveryIsAccurate = TRUE
    OwnerBoundLifetime = TRUE
    PublishUnderClaim = TRUE
    PublishOrder = "manifest-first"
    RefusesWhenBlind = TRUE
INVARIANT TypeOK
INVARIANT AtMostOneLive
INVARIANT LiveJobHasDurableTrace
INVARIANT TerminalHasEvidence
INVARIANT RecordMatchesEvidence
CHECK_DEADLOCK TRUE
