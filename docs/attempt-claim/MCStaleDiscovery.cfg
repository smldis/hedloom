\* Mutation: `discover` returns a negative answer for work the substrate has
\* actually accepted, while still declaring discovery_is_authoritative. On
\* its own this changes nothing, because a claim held across a live job and
\* owner-bound lifetime leave no window for it to matter. Expected: all
\* invariants hold. Compare MCDetached.
SPECIFICATION Spec
CONSTANTS
    Callers = {c1, c2}
    Outcomes = {succeeded, unreconciled}
    MaxCrashes = 1
    LockHonoured = TRUE
    DiscoveryIsAccurate = FALSE
    OwnerBoundLifetime = TRUE
    PublishUnderClaim = TRUE
    PublishOrder = "manifest-first"
INVARIANT TypeOK
INVARIANT AtMostOneLive
INVARIANT LiveJobHasDurableTrace
INVARIANT TerminalHasEvidence
INVARIANT RecordMatchesEvidence
CHECK_DEADLOCK TRUE
