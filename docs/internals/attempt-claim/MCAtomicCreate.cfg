\* Record creation as it ships since 2026-08-28: the record is renamed into
\* place with its layout already in it, so it is never visible half-built.
\* Checked for progress rather than only for safety -- somebody gets a result.
\* Expected: all invariants hold and SomeoneCompletes holds.
\*
\* MaxCrashes = 0 on purpose. Progress cannot be promised when the caller
\* holding the record may die, and a liveness failure caused by a crash would
\* say nothing about the protocol. The crash cases are covered by the
\* invariants in the other configurations.
SPECIFICATION Spec
CONSTANTS
    Callers = {c1, c2}
    Outcomes = {succeeded, unreconciled}
    MaxCrashes = 0
    LockHonoured = TRUE
    DiscoveryIsAccurate = TRUE
    OwnerBoundLifetime = TRUE
    PublishUnderClaim = TRUE
    PublishOrder = "manifest-first"
    RefusesWhenBlind = TRUE
    CreateAtomically = TRUE
INVARIANT TypeOK
INVARIANT AtMostOneLive
INVARIANT LiveJobHasDurableTrace
INVARIANT TerminalHasEvidence
INVARIANT RecordMatchesEvidence
PROPERTY SomeoneCompletes
CHECK_DEADLOCK TRUE
