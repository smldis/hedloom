\* Mutation: work outlives the caller that submitted it -- a pooled or
\* detached substrate rather than `bsub -I` -- *and* discovery cannot see it.
\* This is the pair the `attached` disposition exists for.
\*
\* Expected: LiveJobHasDurableTrace is violated. The caller dies with its job
\* still running, the record says `submit_lost`, and the durable trace now
\* denies work that is on the farm right now. AtMostOneLive survives this
\* trace -- the resubmission that would break it comes later -- so naming it
\* here, as this comment did until it was run, points a reader at the wrong
\* failure. The record going wrong is the *first* thing that goes wrong.
\*
\* Read this as an over-approximation of pooled placement rather than a model
\* of it: a pooled worker is not owner-bound the way `bsub -I` is, but it does
\* die when its scheduler goes, after `death_timeout`. This config denies the
\* binding entirely and forever. See docs/pooled-placement-plan.md.
SPECIFICATION Spec
CONSTANTS
    Callers = {c1, c2}
    Outcomes = {succeeded, unreconciled}
    MaxCrashes = 1
    LockHonoured = TRUE
    DiscoveryIsAccurate = FALSE
    OwnerBoundLifetime = FALSE
    PublishUnderClaim = TRUE
    PublishOrder = "manifest-first"
    RefusesWhenBlind = FALSE
INVARIANT TypeOK
INVARIANT AtMostOneLive
INVARIANT LiveJobHasDurableTrace
INVARIANT TerminalHasEvidence
INVARIANT RecordMatchesEvidence
CHECK_DEADLOCK TRUE
