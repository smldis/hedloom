\* Pooled LSF placement, as shipped. The substrate `MCDetached` was written in
\* advance of: work that outlives the caller that submitted it, and discovery
\* that cannot see it.
\*
\* `LSFPooledTransport` declares `discovery_is_authoritative = False` because a
\* pooled invocation is a Dask future on a scheduler this process owns -- if the
\* submitter dies the future dies with it and nothing on the farm remembers the
\* invocation. And the work is not owner-bound the way `bsub -I` is: the pooled
\* worker stops only when it notices its scheduler has gone, after
\* `death_timeout`. `OrphanFinishes` is that delay.
\*
\* The one difference from MCDetached is RefusesWhenBlind, and it is the whole
\* point: `launch_or_attach` raises `UnrecoverableAttempt` rather than recording
\* `submit_lost`, because a transport that cannot confirm acceptance must not be
\* read as denying it. MCDetached denies that refusal and gets the duplicate;
\* this config keeps it.
\*
\* Expected: no violation. Safety is bought by refusing, not by discovery and
\* not by owner binding -- and the cost of that refusal is recoverability, which
\* no invariant here measures. See docs/attempt-claim-protocol.md.
SPECIFICATION Spec
CONSTANTS
    Callers = {c1, c2}
    Outcomes = {succeeded, unreconciled}
    MaxCrashes = 1
    LockHonoured = TRUE
    DiscoveryIsAccurate = FALSE
    OwnerBoundLifetime = FALSE
    PublishUnderClaim = TRUE
    PublishOrder = "manifest-first"
    RefusesWhenBlind = TRUE
INVARIANT TypeOK
INVARIANT AtMostOneLive
INVARIANT LiveJobHasDurableTrace
INVARIANT TerminalHasEvidence
INVARIANT RecordMatchesEvidence
CHECK_DEADLOCK TRUE
