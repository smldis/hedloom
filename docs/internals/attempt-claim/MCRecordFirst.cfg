\* Mutation: `publish_terminal` records the terminal event before the
\* manifest rename, reversing the order its docstring insists on. Expected:
\* TerminalHasEvidence is violated -- and without needing a crash, because
\* the window between the two writes is itself a state where the journal
\* claims a terminal outcome no manifest backs.
SPECIFICATION Spec
CONSTANTS
    Callers = {c1, c2}
    Outcomes = {succeeded, unreconciled}
    MaxCrashes = 1
    LockHonoured = TRUE
    DiscoveryIsAccurate = TRUE
    OwnerBoundLifetime = TRUE
    PublishUnderClaim = TRUE
    PublishOrder = "record-first"
    RefusesWhenBlind = TRUE
    CreateAtomically = TRUE
INVARIANT TypeOK
INVARIANT AtMostOneLive
INVARIANT LiveJobHasDurableTrace
INVARIANT TerminalHasEvidence
INVARIANT RecordMatchesEvidence
CHECK_DEADLOCK TRUE
