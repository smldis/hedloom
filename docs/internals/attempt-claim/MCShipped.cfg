\* The protocol exactly as shipped. `launch_or_attach` releases the claim
\* before `reconcile` runs, so two callers can be reconciling one attempt at
\* once. Expected: RecordMatchesEvidence is violated.
SPECIFICATION Spec
CONSTANTS
    Callers = {c1, c2}
    Outcomes = {succeeded, unreconciled}
    MaxCrashes = 1
    LockHonoured = TRUE
    DiscoveryIsAccurate = TRUE
    OwnerBoundLifetime = TRUE
    PublishUnderClaim = FALSE
    PublishOrder = "manifest-first"
    RefusesWhenBlind = TRUE
    CreateAtomically = TRUE
INVARIANT TypeOK
INVARIANT AtMostOneLive
INVARIANT LiveJobHasDurableTrace
INVARIANT TerminalHasEvidence
INVARIANT RecordMatchesEvidence
CHECK_DEADLOCK TRUE
