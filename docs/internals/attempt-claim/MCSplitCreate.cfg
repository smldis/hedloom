\* Record creation as it was before 2026-08-28: `mkdir` and the layout write
\* were two visible steps, and whether the record was new was decided before
\* the lock was taken. The mutation of MCAtomicCreate, one constant denied.
\*
\* Expected: every invariant still holds -- no duplicate submission, nothing
\* recorded without evidence -- and SomeoneCompletes is violated. That is the
\* whole point of the configuration: the defect it reproduces is invisible to
\* safety. A caller that saw the record absent can lose the lock to one that
\* did not, the second refuses a record it thinks is foreign, the first is
\* refused as contended, and no caller ever writes the layout.
\*
\* This is not hypothetical. It was measured on the implementation before the
\* fix: over forty runs of eight threads against one record, the payload ran
\* once thirty-eight times and nought times twice.
SPECIFICATION Spec
CONSTANTS
    Callers = {c1, c2}
    Outcomes = {succeeded, unreconciled}
    MaxCrashes = 0
    LockHonoured = TRUE
    DiscoveryIsAccurate = TRUE
    OwnerBoundLifetime = TRUE
    PublishUnderClaim = TRUE
    PublishOrder = "manifest-first"
    RefusesWhenBlind = TRUE
    CreateAtomically = FALSE
INVARIANT TypeOK
INVARIANT AtMostOneLive
INVARIANT LiveJobHasDurableTrace
INVARIANT TerminalHasEvidence
INVARIANT RecordMatchesEvidence
PROPERTY SomeoneCompletes
CHECK_DEADLOCK TRUE
