\* Mutation: cancel the in-flight work too instead of waiting for it. Dask
\* cannot interrupt those threads, so the jobs run anyway -- but their
\* futures are gone. Expected: with the record authoritative the report stays
\* honest, which is worth knowing: preserving in-flight futures is an
\* optimisation, not what makes the report true.
SPECIFICATION Spec
CONSTANTS
    Tasks = {t1, t2, t3}
    ExecutingTest = "call-stack"
    PreserveInFlight = FALSE
    BlockedFromRecord = TRUE
    OutcomeFromRecord = TRUE
INVARIANT TypeOK
INVARIANT ReportIsTotal
INVARIANT TruthfulOutcomes
INVARIANT NoQueuedWorkSurvivesTheStop
INVARIANT BlockedNeverRan
CHECK_DEADLOCK TRUE
