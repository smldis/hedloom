\* Half a repair: decide the blocked lines after the cancel from the durable
\* record rather than from the stale snapshot, but still read the outcome
\* back through the future. Expected: TruthfulOutcomes is violated instead --
\* the future was cancelled, so `future.result()` raises and a succeeded
\* invocation is reported failed. Classification alone is not enough.
SPECIFICATION Spec
CONSTANTS
    Tasks = {t1, t2, t3}
    ExecutingTest = "call-stack"
    PreserveInFlight = TRUE
    BlockedFromRecord = TRUE
    OutcomeFromRecord = FALSE
INVARIANT TypeOK
INVARIANT ReportIsTotal
INVARIANT TruthfulOutcomes
INVARIANT NoQueuedWorkSurvivesTheStop
INVARIANT BlockedNeverRan
CHECK_DEADLOCK TRUE
