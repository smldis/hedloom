\* `_stop_admitting` exactly as shipped: one `call_stack()` snapshot, work
\* with a live stack preserved, everything else cancelled and reported
\* blocked. Expected: BlockedNeverRan is violated -- a task that acquires a
\* thread between the snapshot and the cancel runs to completion and is
\* reported as if it never ran.
SPECIFICATION Spec
CONSTANTS
    Tasks = {t1, t2, t3}
    ExecutingTest = "call-stack"
    PreserveInFlight = TRUE
    BlockedFromRecord = FALSE
    OutcomeFromRecord = FALSE
INVARIANT TypeOK
INVARIANT ReportIsTotal
INVARIANT TruthfulOutcomes
INVARIANT NoQueuedWorkSurvivesTheStop
INVARIANT BlockedNeverRan
CHECK_DEADLOCK TRUE
