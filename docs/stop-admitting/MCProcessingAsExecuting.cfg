\* Mutation: ask which tasks are *assigned to a worker* instead of which have
\* a live Python stack -- what `Client.processing()` answers, and what this
\* code said before R10. Every task carries a placement annotation, so
\* root-task queuing is bypassed and the whole graph is assigned at once.
\* Expected: nothing is ever cancelled and the stop does not stop.
SPECIFICATION Spec
CONSTANTS
    Tasks = {t1, t2, t3}
    ExecutingTest = "assigned"
    PreserveInFlight = TRUE
    BlockedFromRecord = TRUE
    OutcomeFromRecord = TRUE
INVARIANT TypeOK
INVARIANT ReportIsTotal
INVARIANT TruthfulOutcomes
INVARIANT NoQueuedWorkSurvivesTheStop
INVARIANT BlockedNeverRan
CHECK_DEADLOCK TRUE
