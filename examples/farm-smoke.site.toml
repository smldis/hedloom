# Minimal, directly runnable profile for examples/farm_smoke.py.
# Relative storage paths are anchored to this file's directory.
[study]
root = "_runs/farm-smoke/attempts"
workspace_root = "_runs/farm-smoke/work"

[placement.lsf]
kind = "lsf-interactive"
queue = "reg"
walltime = "1"
cores = 1
timeout = 300
# How many of these may be in flight at once: the share of the farm this study
# may spend, which is *not* your LSF MAX JOB policy. That policy counts every
# job you have running from any source, so leave headroom for whatever you
# submit by other means — otherwise yours and hedloom's queue behind each
# other, and hedloom's worker threads sit held by `bsub -I` clients that are
# still waiting. It sizes the worker whose threads hold those clients, and
# nothing else may spend them. Deliberately small here — a smoke test should
# not queue a farm.
max_jobs = 4

[kernel]
# Local concurrency on the submit host, which is a different machine's problem
# from the number above.
threads = 2
