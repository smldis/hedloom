# Minimal, directly runnable profile for examples/farm_smoke.py.
# Relative storage paths are anchored to this file's directory.
[study]
root = "_runs/farm-smoke/attempts"
workspace_root = "_runs/farm-smoke/work"

[placement.lsf]
kind = "lsf-interactive"
queue = "reg"
walltime = "1"
cores = 1
timeout = 300
# How many of these may be in flight at once: this user's LSF MAX JOB policy.
# It sizes the worker whose threads hold the waiting `bsub -I` clients, and
# nothing else may spend them. Deliberately small here — a smoke test should
# not queue a farm.
max_jobs = 4

[kernel]
# Local concurrency on the submit host, which is a different machine's problem
# from the number above.
threads = 2
