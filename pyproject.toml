[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hedloom"
version = "0.1.0"
description = "Author a study, plan it, and run it, in one place."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["hedloom-flow", "hedloom-exec", "hedloom-run"]

[project.optional-dependencies]
# A floor rather than a pin; `hedloom-run` carries the reasoning.
dask = ["distributed>=2023.9.2"]
# Pooled LSF placement. Deferred through to `hedloom-run`, which is the unit
# that owns binding and is the only one allowed to import Dask at all.
pooled = ["hedloom-run[pooled]"]

[tool.uv.workspace]
members = ["flow", "exec", "run"]

[tool.uv.sources]
hedloom-flow = { workspace = true }
hedloom-exec = { workspace = true }
hedloom-run  = { workspace = true }

[dependency-groups]
dev = ["hedloom-flow[dask]", "hedloom-run[pooled]", "bokeh", "pytest",
       "setuptools>=69"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
